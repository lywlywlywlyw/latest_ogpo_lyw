# DSRL-NA: action TD critic teaches the noise critic at z ~ N(0,I).
# Reuses DSRL replay collection; both critics update once per minibatch.
_base_: dsrl.yaml

agent:
  agent_name: dsrlna
  use_replay_buffer_z: false  # Distill at replay (s, z) instead of fresh Gaussian z.
  use_target_q: false  # Use target Qa as the distillation teacher.
