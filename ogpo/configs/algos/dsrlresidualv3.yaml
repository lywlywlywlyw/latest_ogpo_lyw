# Flow BC -> inverse-latent Gaussian/MPPCA base -> z_base + conditional Gaussian residual.
_base_: dsrlna.yaml

agent:
  agent_name: dsrlresidualv3
  use_normal_base_encoder: false  # True: skip base BC and use N(0,I) as the frozen base
  use_top_distribution: false  # Fit frozen MPPCA from inverted demos, as in train_invertion_offline
  top_distribution_components: 2
  top_distribution_rank: 20  # Effective rank min(top_distribution_rank, noise_dim - 1)
  top_distribution_max_iter: 100
  top_distribution_tol: 1e-4
  use_top_inversion: false  # True: invert offline demos with TOP midpoint (t=0.95 -> 0, 10 steps, NFE=20)
  use_base_distribution_in_qdistill: false  # True: sample z from the frozen base (without residual)
  use_invertionencoder_retrainflow: false  # After base BC, randomly reinitialize Flow/optimizer and train from frozen encoder samples
  invertionencoder_retrainflow_steps: null  # null: task default steps/early stopping (Square/ToolHang 500k, Transport 1M); explicit steps: no early stopping
  base_bc_steps: 100000
  # Clip residual log standard deviation when both bounds are set.
  online_log_std_min: null #-10.0
  online_log_std_max: null #0.0
  use_actor_entropy: false  # SAC on the conditional residual Gaussian only; default target = -noise_dim
  target_entropy_value: null  # Explicit target overrides low/SERL logic; null keeps existing defaults
  use_serl_target_entropy: false  # With actor entropy enabled, use target_entropy = -noise_dim / 2
  use_low_target_entropy: false  # With actor entropy enabled, use -2 * noise_dim; overrides use_serl_target_entropy
  use_restrain_loss: true     # Enable the residual L2 constraint and its dual loss
  restrain_threshold: 0.35    # E[||sampled residual latent||_2] <= threshold
  init_restrain_multiplier: 1.0
  noise_chunk_length: -1
  entropy_backup: false
